# WebAPI Application Properties
# All properties have sensible defaults and can be overridden via environment variables
# Spring Boot relaxed binding: DATASOURCE_PASSWORD env var -> datasource.password property

build.number=NA

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
datasource.driverClassName=${DATASOURCE_DRIVERCLASSNAME:org.postgresql.Driver}
datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=webapi}
datasource.username=${DATASOURCE_USERNAME:postgres}
datasource.password=${DATASOURCE_PASSWORD:}
datasource.dialect=${DATASOURCE_DIALECT:postgresql}
datasource.ohdsi.schema=${DATASOURCE_OHDSI_SCHEMA:webapi}
datasource.dialect.source=${datasource.dialect}

# CDM Properties
source.name=${SOURCE_NAME:SYNPUF5PCT}
cdm.version=${CDM_VERSION:5}

# =============================================================================
# FLYWAY MIGRATION (inherits from primary datasource)
# =============================================================================
spring.flyway.enabled=true
spring.flyway.driver-class-name=${DATASOURCE_DRIVERCLASSNAME:org.postgresql.Driver}
spring.flyway.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=webapi}
spring.flyway.user=${DATASOURCE_USERNAME:postgres}
spring.flyway.password=${DATASOURCE_PASSWORD:}
spring.flyway.table=flyway_schema_history
spring.flyway.fail-on-missing-locations=true
spring.flyway.locations=${flyway.locations:classpath:db/migration/postgresql}
spring.flyway.schemas=${DATASOURCE_OHDSI_SCHEMA:webapi}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${flyway.baseline-version:0}
spring.flyway.validate-on-migrate=${flyway.validateOnMigrate:false}
spring.flyway.out-of-order=${flyway.out-of-order:true}
spring.flyway.placeholders.ohdsiSchema=${DATASOURCE_OHDSI_SCHEMA:webapi}

# =============================================================================
# JPA / HIBERNATE (inherits schema from datasource)
# =============================================================================
spring.datasource.initialize=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DATASOURCE_OHDSI_SCHEMA:webapi}
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# =============================================================================
# SPRING BATCH (inherits schema from datasource)
# =============================================================================
spring.batch.job.enabled=false
spring.batch.initializer.enabled=false
spring.batch.repository.tableprefix=${DATASOURCE_OHDSI_SCHEMA:webapi}.batch_
spring.batch.repository.isolationLevelForCreate=ISOLATION_DEFAULT
spring.batch.taskExecutor.corePoolSize=5
spring.batch.taskExecutor.maxPoolSize=10
spring.batch.taskExecutor.queueCapacity=500
spring.batch.taskExecutor.threadGroupName=batchGroup
spring.batch.taskExecutor.threadNamePrefix=batchExec

# =============================================================================
# HIKARI CONNECTION POOL
# =============================================================================
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-test-query-timeout=1000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.register-mbeans=false
spring.datasource.hikari.mbean-name=

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=8080
server.context-path=/WebAPI
server.ssl.enabled=false
server.ssl.key-store=
server.ssl.key-store-password=
server.ssl.key-password=

# =============================================================================
# SECURITY - CORE
# =============================================================================
security.provider=DisabledSecurity
security.cors.enabled=true
security.origin=*
security.token.expiration=43200
security.ssl.enabled=false
security.defaultGlobalReadPermissions=true

# Lockout policy
security.maxLoginAttempts=5
security.duration.initial=30
security.duration.increment=30

# =============================================================================
# SECURITY - AUTH PROVIDERS (all disabled by default)
# =============================================================================
security.auth.jdbc.enabled=false
security.auth.ldap.enabled=false
security.auth.ad.enabled=false
security.auth.windows.enabled=false
security.auth.kerberos.enabled=false
security.auth.openid.enabled=false
security.auth.google.enabled=false
security.auth.facebook.enabled=false
security.auth.github.enabled=false
security.auth.cas.enabled=false

# =============================================================================
# SECURITY - DATABASE (defaults to primary datasource)
# =============================================================================
security.db.datasource.driverClassName=${DATASOURCE_DRIVERCLASSNAME:org.postgresql.Driver}
security.db.datasource.url=${SECURITY_DB_DATASOURCE_URL:${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=webapi}}
security.db.datasource.username=${SECURITY_DB_DATASOURCE_USERNAME:${DATASOURCE_USERNAME:postgres}}
security.db.datasource.password=${SECURITY_DB_DATASOURCE_PASSWORD:${DATASOURCE_PASSWORD:}}
security.db.datasource.schema=webapi_security
security.db.datasource.authenticationQuery=SELECT password, first_name AS firstname, middle_name AS middlename, last_name AS lastname FROM ${security.db.datasource.schema}.sec_user WHERE login = ?

# =============================================================================
# SECURITY - OAUTH
# =============================================================================
security.oauth.callback.ui=
security.oauth.callback.api=
security.oauth.callback.urlResolver=query
security.oauth.google.apiKey=
security.oauth.google.apiSecret=
security.oauth.facebook.apiKey=
security.oauth.facebook.apiSecret=
security.oauth.github.apiKey=
security.oauth.github.apiSecret=

# =============================================================================
# SECURITY - OPENID
# =============================================================================
security.oid.clientId=
security.oid.apiSecret=
security.oid.url=
security.oid.redirectUrl=
security.oid.logoutUrl=
security.oid.extraScopes=
# security.oid.customParams - set via SECURITY_OID_CUSTOMPARAMS env var if needed

# =============================================================================
# SECURITY - LDAP
# =============================================================================
security.ldap.dn=
security.ldap.url=
security.ldap.baseDn=
security.ldap.system.username=
security.ldap.system.password=
security.ldap.searchString=
security.ldap.searchBase=
security.ldap.userMapping.displaynameAttr=
security.ldap.userMapping.firstnameAttr=
security.ldap.userMapping.middlenameAttr=
security.ldap.userMapping.lastnameAttr=
security.ldap.userMapping.usernameAttr=
security.ldap.userImport.usernameAttr=
security.ldap.userImport.loginAttr=

# =============================================================================
# SECURITY - ACTIVE DIRECTORY
# =============================================================================
security.ad.url=
security.ad.searchBase=
security.ad.principalSuffix=
security.ad.system.username=
security.ad.system.password=
security.ad.searchFilter=
security.ad.searchString=
security.ad.ignore.partial.result.exception=false
security.ad.result.count.limit=1000
security.ad.default.import.group=
security.ad.userMapping.displaynameAttr=
security.ad.userMapping.firstnameAttr=
security.ad.userMapping.middlenameAttr=
security.ad.userMapping.lastnameAttr=
security.ad.userMapping.usernameAttr=
security.ad.userImport.usernameAttr=
security.ad.userImport.loginAttr=

# =============================================================================
# SECURITY - SAML
# =============================================================================
security.saml.enabled=false
security.saml.entityId=
security.saml.idpMetadataLocation=
security.saml.keyManager.keyStoreFile=
security.saml.keyManager.storePassword=
security.saml.keyManager.defaultKey=
security.saml.keyManager.passwords.arachnenetwork=
security.saml.metadataLocation=
security.saml.callbackUrl=
security.saml.sloUrl=
security.saml.maximumAuthenticationLifetime=3600

# =============================================================================
# SECURITY - CAS
# =============================================================================
security.cas.loginUrl=
security.cas.callbackUrl=
security.cas.serverUrl=
security.cas.cassvcs=
security.cas.casticket=

# =============================================================================
# SECURITY - KERBEROS
# =============================================================================
security.kerberos.spn=
security.kerberos.keytabPath=
kerberos.timeout=60000
kerberos.configPath=
kerberos.kinitPath=

# =============================================================================
# SECURITY - GOOGLE IAP
# =============================================================================
security.googleIap.cloudProjectId=
security.googleIap.backendServiceId=
security.google.accessToken.enabled=false

# =============================================================================
# LOGGING
# =============================================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.orm=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate=INFO
logging.level.org.ohdsi=INFO

# =============================================================================
# SPRING AUTOCONFIGURATION
# =============================================================================
# Exclude LDAP auto-configuration by default (causes issues with Java 21+ module access)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration,org.springframework.boot.autoconfigure.ldap.embedded.EmbeddedLdapAutoConfiguration

# =============================================================================
# JACKSON
# =============================================================================
spring.jackson.serialization.write-dates-as-timestamps=true

# =============================================================================
# JERSEY / JAX-RS
# =============================================================================
jersey.config.server.wadl.disableWadl=true
jersey.resources.root.package=org.ohdsi.webapi

# =============================================================================
# SPRING CACHE
# =============================================================================
spring.cache.jcache.config=classpath:appCache.xml
spring.cache.type=simple

# =============================================================================
# COMPRESSION
# =============================================================================
compression=true
compressableMimeType=application/json,application/xml,text/html,text/xml,text/plain

# =============================================================================
# CSRF (disabled for REST API)
# =============================================================================
csrf.disable=true

# =============================================================================
# SPARQL / SOLR
# =============================================================================
sparql.endpoint=http://virtuoso.ohdsi.org:8890/sparql?default-graph-uri=&query=
solr.endpoint=
solr.query.prefix=

# =============================================================================
# R SERVICE
# =============================================================================
r.serviceHost=

# =============================================================================
# PERSON SETTINGS
# =============================================================================
person.viewDates=false

# =============================================================================
# HERACLES
# =============================================================================
heracles.smallcellcount=5

# =============================================================================
# JASYPT ENCRYPTION
# =============================================================================
jasypt.encryptor.enabled=false
jasypt.encryptor.password=
jasypt.encryptor.algorithm=PBEWithMD5AndDES

# =============================================================================
# ORGANIZATION
# =============================================================================
organization.name=OHDSI

# =============================================================================
# JDBC TEMPLATE
# =============================================================================
jdbc.suppressInvalidApiException=false

# =============================================================================
# SENSITIVE INFO
# =============================================================================
sensitiveinfo.admin.role=
sensitiveinfo.moderator.role=
sensitiveinfo.analysis.extensions=
analysis.result.zipVolumeSizeMb=100

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================
cdm.result.cache.warming.enable=false
cdm.cache.achilles.warming.enable=false
cdm.cache.cron.warming.enable=false
cdm.cache.cron.expression=0 0 2 * * ?
cache.generation.invalidAfterDays=30
cache.generation.cleanupInterval=86400000
cache.generation.useAsync=true
cache.jobs.count=5
cache.achilles.usePersonCount=true

# =============================================================================
# GIS
# =============================================================================
atlasgis.enabled=${gis.enabled:false}

# =============================================================================
# I18N
# =============================================================================
i18n.enabled=false
i18n.defaultLocale=en

# =============================================================================
# TAGS
# =============================================================================
tag.enabled=false
tag.refreshStat.period=60000

# =============================================================================
# VERSIONING
# =============================================================================
versioning.maxAttempt=3

# =============================================================================
# AUDIT TRAIL
# =============================================================================
audit.trail.enabled=${AUDIT_TRAIL_ENABLED:false}
audit.trail.log.file=${AUDIT_TRAIL_LOG_FILE:}
audit.trail.log.file.pattern=${AUDIT_TRAIL_LOG_FILE_PATTERN:}
audit.trail.log.extraFile=${AUDIT_TRAIL_LOG_EXTRAFILE:}

# =============================================================================
# TREXSQL
# =============================================================================
trexsql.enabled=false
trexsql.cache-path=/tmp/trexsql
trexsql.extensions-path=

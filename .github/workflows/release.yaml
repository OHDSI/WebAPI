
# Create release files and publish Docker images
name: Release

on:
  release:
    types: [published]

env:
  DOCKER_IMAGE: ohdsi/webapi

jobs:
  # Build JAR and WAR and attach them to the GitHub Release
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Check out the exact commit associated with the release tag
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      # The miredot plugin's POM cannot be resolved by Maven 3.10+
      # (${toolsjar} is never set), so pin Maven 3.9.16.
      - name: Set up Maven
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      - name: Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build executable JAR
      - name: Build JAR
        run: mvn -B -DskipTests=true -DskipUnitTests=true -Dpackaging.type=jar package

      # Build deployable WAR for Tomcat
      - name: Build WAR
        run: mvn -B -DskipTests=true -DskipUnitTests=true package

      # Keep original filenames for direct deployment.
      # Generate checksums for verifying downloaded artifacts.
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp target/WebAPI.jar dist/WebAPI.jar
          cp target/WebAPI.war dist/WebAPI.war

          cd dist
          sha256sum WebAPI.jar WebAPI.war > SHA256SUMS.txt

      # Attach artifacts to the existing GitHub Release.
      # This does not create a new release.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/WebAPI.jar
            dist/WebAPI.war
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true

  # Build and push tagged release Docker image to
  # ohdsi/webapi:<version> and ohdsi/webapi:latest.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Add Docker labels and tags
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Setup Docker build environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set build parameters
        id: build_params
        run: |
          echo "sha8=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          # Allow running the image on the architectures supported by the base image.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_BRANCH=${{ steps.docker_meta.outputs.version }}
            GIT_COMMIT_ID_ABBREV=${{ steps.build_params.outputs.sha8 }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          # Use runtime labels from docker_meta as well as fixed labels
          labels: |
            ${{ steps.docker_meta.outputs.labels }}
            maintainer=Joris Borgdorff <joris@thehyve.nl>, Lee Evans - www.ltscomputingllc.com
            org.opencontainers.image.authors=Joris Borgdorff <joris@thehyve.nl>, Lee Evans - www.ltscomputingllc.com
            org.opencontainers.image.vendor=OHDSI
            org.opencontainers.image.licenses=Apache-2.0

      - name: Inspect image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.docker_meta.outputs.version }}
          docker image inspect ${{ env.DOCKER_IMAGE }}:${{ steps.docker_meta.outputs.version }}
